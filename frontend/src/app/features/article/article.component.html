<div class="article">
  <div class="article-header">
    <div class="article-data">
      <h2>
        {{ article().title }}
      </h2>
      <div class="published-date">
        {{ article().publishedDate | date: 'EEEE, dd/MMM/yyyy' }}
      </div>
    </div>
  </div>
  <div class="article-content">
    {{ article().content }}
  </div>
</div>
<app-article-navigation />
