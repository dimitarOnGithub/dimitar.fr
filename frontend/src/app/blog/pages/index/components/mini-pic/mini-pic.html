@if (!balkanMode) {
  <img src="assets/images/profile_pic.jpg" alt="Dimitar smiling">
  <p>
    that's me, on a rare occasion without my RBF
    <span class="highlight" (click)="switchToBalkanMode()" tabindex=0>
      (Resting Balkan Face)
    </span>
  </p>
} @else {
  <img src="assets/images/resting-balkan-face.jpg" alt="Dimitar with a presumably unhappy expression" (click)="switchToNormalMode()">
  <p>
    it is just how we look in my part of the world
  </p>
}
