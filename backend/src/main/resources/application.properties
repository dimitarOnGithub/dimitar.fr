spring.application.name=web
spring.profiles.active=${SPRING_PROFILE}

# Enforce use of UTC for Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.springframework.security=TRACE

# Do not include the stack trace on exceptions
server.error.include-stacktrace = never

spring.datasource.url=jdbc:mariadb://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
org.mariadb.jdbc=DEBUG
spring.jpa.hibernate.ddl-auto=none

# TODO:
#   need to further think about this - can't have the JTE configs only in the API properties
#   as the JTE package is in the classpath, so it fails compilation;
#   ideal situation would be to rip off all those MVC things away from the API package
gg.jte.developmentMode=false
gg.jte.usePrecompiledTemplates=true
gg.jte.template-location=src/main/jte

server.forward-headers-strategy=framework