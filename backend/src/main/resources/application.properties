spring.application.name=web

# Enforce use of UTC for Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.springframework.security=TRACE

# Do not include the stack trace on exceptions
server.error.include-stacktrace = never

spring.datasource.url=jdbc:mariadb://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
org.mariadb.jdbc=DEBUG
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

gg.jte.developmentMode=false
gg.jte.usePrecompiledTemplates=true
gg.jte.template-location=src/main/jte

server.forward-headers-strategy=framework

# Email client properties
spring.mail.host=${EMAIL_HOST}
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.test-connection=true

# Email message details
mail.sender.address=${EMAIL_SENDER_ADDRESS}
mail.recipient.address=${EMAIL_RECIPIENT_ADDRESS}
