spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:blog_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=sa

# Disable flyway
spring.flyway.enabled=false

# Always recreate the database
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

gg.jte.developmentMode=false
gg.jte.usePrecompiledTemplates=true
gg.jte.template-location=src/main/jte

logging.level.root=DEBUG
logging.level.org.springframework.test=DEBUG

# Email client properties
spring.mail.host=foo
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=bar
spring.mail.password=foobar
spring.mail.test-connection=false

# Email message details
mail.sender.address=foobar
mail.recipient.address=foobar