server {
    server_name dimitar.fr;
    listen 80;
    return 301 https://$host$request_uri;
}

server {

    server_name dimitar.fr;

    include /etc/nginx/conf.d/security/*.conf;

    # Certbot configuration for the Let's Encrypt certificates
    # Important to note that nginx expects that the certificates will already be present when starting up
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    # Nginx error pages
    error_page 429 /429.html;
    error_page 502 /502.html;

    # Redirect from old host
    if ($host = sudosuwinter.me) {
        return 301 https://dimitar.fr/;
    }

    location / {
        limit_req zone=5rs nodelay;
        limit_req_status 429;

        proxy_pass http://prod-mvc:8080;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        expires 1M;
        autoindex on;

        # note to self: when using location and alias like that, the actual location bit gets stripped, ie:
        # foobar.com/static/css/styles.css
        # with the configuration like that:
        # alias /usr/share/nginx/html
        # becomes this on the file system:
        # /usr/share/nginx/htmlcss/styles.css <- notice slashes matter and static gets replaced by the alias config
        # So, to ensure consistency, set the compose setting to copying the full directory and then just map to it
        # directly in here
        alias /prod/static/;
    }

    # Where Certbot will generate the HTTP challenges for the certificate renewals
    location /.well-known/ {
        alias /public/.well-known/;
    }

    location /robots.txt {
        alias /prod/static/robots.txt;
    }

    location ~ ^/(429|502)\.html$ {
        root /prod/static/html;
    }

}