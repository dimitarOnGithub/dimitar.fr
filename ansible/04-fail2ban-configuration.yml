---

- name: Fail2Ban installation & configuration
  hosts: personal

  vars:
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_user: root

  tasks:
    - name: Install Fail2Ban
      ansible.builtin.apt:
        name: fail2ban

    - name: Sync SSH jail file
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/ssh-jail.conf
        src: ./files/ssh-jail.conf
        owner: root
        mode: '644'

    - name: Reload Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Get post-reload state
      ansible.builtin.command: systemctl is-active fail2ban
      register: fail2ban_status

    - name: Record state
      ansible.builtin.debug:
        msg: "Fail2Ban post-restart state: {{ fail2ban_status['stdout'] }}"

    - name: Verify state
      ansible.builtin.fail:
        msg: Fail2Ban has failed to restart post-config deployment
      when: fail2ban_status['stdout'] != "active"

    - name: Enable Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        enabled: yes
