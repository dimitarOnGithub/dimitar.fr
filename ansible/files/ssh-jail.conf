###############################
# Fail2Ban SSH jail file      #
# place in:                   #
# <f2b>/jail.d/               #
###############################

[sshd]
enabled = true
port = ssh
logpath = /var/log/auth.log
maxretry = 3
findtime = 600
# https://github.com/fail2ban/fail2ban/discussions/2952#discussioncomment-414693
# initial ban time:
bantime = 1h
# incremental banning:
bantime.increment = true
# default factor (causes increment - 1h -> 1d 2d 4d 8d 16d 32d ...):
bantime.factor = 24
# max banning time = 5 week:
bantime.maxtime = 5w