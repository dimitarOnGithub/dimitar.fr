
services:

  database:
    expose:
      - "12306:12306"
    environment:
      MYSQL_TCP_PORT: 12306
      MYSQL_UNIX_PORT: 12306

  backend:
    expose:
      - "9090"

  webserver:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd
      - ./backend/static/:/static:ro
      - ./public:/public:ro
      - ${SSL_KEY_LOCATION}:/certs/key.pem:ro
      - ${SSL_CERT_LOCATION}:/certs/cert.pem:ro
      - ${SSL_NGINX_OPTIONS_LOCATION}:/certs/options-ssl-nginx.conf
      - ${SSL_DHPARAMS_LOCATION}:/certs/ssl-dhparams.pem
