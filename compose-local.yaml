include:
  - backend/compose-backend.yaml

services:

  database:
    volumes:
      - mariadb_data:/var/lib/mysql
    expose:
      - "12306"
    environment:
      MYSQL_TCP_PORT: 12306
      MYSQL_UNIX_PORT: 12306

  backend:
    expose:
      - "8080"

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-local.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static/:/static:ro

volumes:
  mariadb_data: