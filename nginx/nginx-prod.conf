events {}

http {
    include     /etc/nginx/mime.types;
    error_log   /dev/stdout debug;

    # Rate limit configurations
    ## 5 requests per second
    ### This is a very strict rate limit and should only be applied to actual endpoints
    ### Make sure to define locations for static files that are not bound by this limit
    ### IMPORTANT -> $binary_remote_addr + Rootless Docker
    ###     It will only work if the driver has been updated:
    ###     https://docs.docker.com/engine/security/rootless/troubleshoot/#docker-run--p-does-not-propagate-source-ip-addresses
    limit_req_zone $binary_remote_addr zone=5rs:10m rate=5r/s;

    # dimitar.fr
    server {
        server_name dimitar.fr;
        listen 80;

        if ($host = dimitar.fr) {
            return 301 https://$host$request_uri;
        }

        if ($host = www.dimitar.fr) {
            return 301 https://$host$request_uri;
        }
        return 404;
    }

    server {
        server_name dimitar.fr;
        # Nginx error pages
        error_page 429 /429.html;
        error_page 502 /502.html;

        if ($host = sudosuwinter.me) {
            return 301 https://dimitar.fr/;
        }

    	location / {
    		limit_req zone=5rs nodelay;
            limit_req_status 429;

    		proxy_pass http://prod-backend:8080;
    		proxy_intercept_errors on;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}

    	location /static/ {
            expires 1M;
            autoindex on;

            # note to self: when using location and alias like that, the actual location bit gets stripped, ie:
            # foobar.com/static/css/styles.css
            # with the configuration like that:
            # alias /usr/share/nginx/html
            # becomes this on the file system:
            # /usr/share/nginx/htmlcss/styles.css <- notice slashes matter and static gets replaced by the alias config
            # So, to ensure consistency, set the compose setting to copying the full directory and then just map to it
            # directly in here
            alias /static/;
        }

        # Where Certbot will generate the HTTP challenges for the certificate renewals
    	location /.well-known/ {
    		alias /public/.well-known/;
    	}

    	location ~ ^/(429|502)\.html$ {
            root /static/html;
        }

        # Certbot configuration for the Let's Encrypt certificates
        # Important to note that nginx expects that the certificates will already be present when starting up
        listen 443 ssl;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        include /certs/options-ssl-nginx.conf;
        ssl_dhparam /certs/ssl-dhparams.pem;
    }

    # stage.dimitar.fr
    server {
        server_name stage.dimitar.fr;
        listen 80;

        if ($host = stage.dimitar.fr) {
            return 301 https://$host$request_uri;
        }

        return 404;
    }

    server {
        server_name stage.dimitar.fr;

        # HTAccess
        auth_basic           "Auth Required";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Nginx error pages
        error_page 429 /429.html;
        error_page 502 /502.html;

        location / {
            limit_req zone=5rs nodelay;
            limit_req_status 429;

            proxy_pass http://stage-backend:8080;
            proxy_intercept_errors on;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            expires 1M;
            autoindex on;

            # note to self: when using location and alias like that, the actual location bit gets stripped, ie:
            # foobar.com/static/css/styles.css
            # with the configuration like that:
            # alias /usr/share/nginx/html
            # becomes this on the file system:
            # /usr/share/nginx/htmlcss/styles.css <- notice slashes matter and static gets replaced by the alias config
            # So, to ensure consistency, set the compose setting to copying the full directory and then just map to it
            # directly in here
            alias /static/;
        }

        # Where Certbot will generate the HTTP challenges for the certificate renewals
        location /.well-known/ {
            # Disable htaccess for this path
            auth_basic off;
            alias /public/.well-known/;
        }

        location ~ ^/(429|502)\.html$ {
            root /static/html;
        }

        # drop spam/malicious traffic
        location ~* \.(env|ini|log|sql|bak|php)$ {
            deny all;
        }

        location ~* ^/wp- {
            deny all;
        }

        # Certbot configuration for the Let's Encrypt certificates
        # Important to note that nginx expects that the certificates will already be present when starting up
        listen 443 ssl;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        include /certs/options-ssl-nginx.conf;
        ssl_dhparam /certs/ssl-dhparams.pem;
    }

}